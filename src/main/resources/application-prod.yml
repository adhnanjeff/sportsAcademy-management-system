server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:badminton_academy}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1
      keepalive-time: 30000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    connect-retries: 10
    connect-retries-interval: 5

  # Production cache settings - aggressive caching for Render free tier
  cache:
    type: caffeine
    cache-names:
      - students:all
      - students:active
      - students:byId
      - students:bySkillLevel
      - students:byParent
      - students:byBatch
      - students:byCoach
      - students:countBySkillLevel
      - students:feeHistory
      - batches:all
      - batches:active
      - batches:byId
      - batches:byCoach
      - batches:bySkillLevel
      - batches:byStudent
      - batches:withSlots
      - coaches:all
      - coaches:active
      - coaches:byId
      - coaches:byEmail
      - coaches:bySpecialization
      - coaches:byExperience
      - coaches:byBatch
      - coaches:count
    caffeine:
      spec: maximumSize=3000,expireAfterWrite=60m

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.badminton.academy: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

app:
  seed-data: false
  cors:
    allowed-origins: ${FRONTEND_URL:https://sports-academy-management-system-ui-wine.vercel.app}
