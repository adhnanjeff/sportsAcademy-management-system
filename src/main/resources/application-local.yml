spring:
  datasource:
    url: jdbc:h2:mem:badminton_academy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false  # Disable Flyway for local H2 - use JPA to create schema instead

logging:
  level:
    com.badminton.academy: DEBUG

app:
  seed-data: false

# For local development, you can use LocalStack or keep it same as dev
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:badminton-academy-images-local}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY:local-access-key}
    secret-key: ${AWS_SECRET_KEY:local-secret-key}
