# Render Blueprint for Badminton Academy Management System
services:
  - type: web
    name: badminton-academy-backend
    env: docker
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-academy-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: badminton-academy-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: badminton-academy-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION
        value: us-east-1

databases:
  - name: badminton-academy-db
    databaseName: badminton_academy
    user: badminton_user
    region: oregon
    plan: free
